[defaults]
inventory = ./hosts.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 60

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o UserKnownHostsFile=../.runtime/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
